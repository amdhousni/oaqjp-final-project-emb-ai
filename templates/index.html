<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='mywebscript.css') }}">
</head>
<body>
    <header>
        <h1>Emotion Detector</h1>
        <p>Type a sentence and the Watson NLP library will tell you which
            emotion it expresses.</p>
    </header>

    <main>
        <label for="textToAnalyze">Enter text for analysis:</label>
        <textarea id="textToAnalyze" rows="4" placeholder="I am glad this happened"></textarea>
        <button type="button" onclick="RunSentimentAnalysis()">Analyze Emotion</button>

        <div id="system_response" role="status" aria-live="polite"></div>
    </main>

    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
